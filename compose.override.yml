services:
  vite:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node-modules-volume:/app/node_modules
    networks:
      - kialent

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    env_file: .env
    environment:
      RUN_MIGRATIONS: "0"
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-kialent}
      DB_USERNAME: ${DB_USERNAME:-kialent}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - .:/var/www/html
      - vendor-volume:/var/www/html/vendor
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - kialent

volumes:
  node-modules-volume:
