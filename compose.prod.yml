services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
    image: kialent-app-prod
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-kialent}
      DB_USERNAME: ${DB_USERNAME:-kialent}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes: !override
      - public-volume:/var/www/html/public
      - storage-volume:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kialent

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "443:443"
    volumes: !override
      - public-volume:/var/www/html/public:ro
      - storage-volume:/var/www/html/storage/app/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - kialent

  certbot:
    image: certbot/certbot
    profiles: [tools]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: prod
    image: kialent-app-prod
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    env_file: .env
    environment:
      RUN_MIGRATIONS: "0"
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-kialent}
      DB_USERNAME: ${DB_USERNAME:-kialent}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes: !override []
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - kialent

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-kialent}
      MARIADB_USER: ${DB_USERNAME:-kialent}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kialent

volumes:
  public-volume:
  storage-volume:
